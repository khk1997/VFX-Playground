<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05070b">
<meta name="description" content="VFX Playground — 以光、材質與動態構成的互動視覺實驗集。">
<title>VFX Playground — Optical Experiments</title>
<link rel="stylesheet" href="./home.css?v=ios27-gallery-2">
</head>
<body>
<a class="skip-link" href="#gallery">跳至作品列表</a>

<div id="bg" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-noise"></div>
</div>

<div class="site-shell">
  <nav class="topbar" aria-label="主要導覽">
    <a class="brand" href="./" aria-label="VFX Playground 首頁">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-copy">
        <strong>VFX / PLAYGROUND</strong>
        <span>Optical archive · 2026</span>
      </span>
    </a>
    <div class="topbar-meta">
      <span class="work-count"><span id="visibleCount">13</span> / 13 EXPERIMENTS</span>
      <button id="sndBtn" type="button" aria-label="切換介面音效" aria-pressed="true">
        <span class="sound-dot" aria-hidden="true"></span>
        <span>SOUND</span>
      </button>
    </div>
  </nav>

  <main id="gallery">
    <div class="gallery-head">
      <div class="filters" role="group" aria-label="作品分類">
        <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" type="button" data-filter="liquid" aria-pressed="false">Liquid</button>
        <button class="filter-btn" type="button" data-filter="canvas" aria-pressed="false">Canvas</button>
        <button class="filter-btn" type="button" data-filter="audio" aria-pressed="false">Audio</button>
        <button class="filter-btn" type="button" data-filter="typography" aria-pressed="false">Type</button>
      </div>
    </div>

    <section id="cards" aria-live="polite" aria-label="視覺特效作品"></section>
  </main>

  <footer class="site-footer">
    <span><strong>VFX Playground</strong> — real-time visual studies</span>
    <span>Canvas · WebGL · Three.js · GLSL</span>
  </footer>
</div>

<script type="module" src="./home.js?v=ios27-gallery-2"></script>
</body>
</html>
