<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora VFX</title>
<link rel="stylesheet" href="./aurora.css">
<link rel="stylesheet" href="../switch2-theme.css?v=mobile-sheet-22">
<script src="../preview-performance.js"></script>
<script src="../mobile-control-sheet.js?v=mobile-sheet-22"></script>
</head>
<body data-mobile-ui="compact">
<canvas id="stage"></canvas>

<a id="homeBtn" href="../index.html">← 首頁</a>

<div id="panel">
  <h2>AURORA</h2>
  <div class="sub">音訊反應極光 — 音樂喚醒光幕、星塵與雪地映光</div>

  <div class="groups">
  <div class="group">
    <h3>音訊反應 Audio Reactive</h3>
    <div class="audioBtns">
      <button id="audioNatural" class="active">自然模式</button>
      <button id="audioSynth">背景音樂</button>
      <button id="audioMic">麥克風</button>
      <button id="audioFile">音樂檔</button>
    </div>
    <div id="audioState">等待音訊輸入</div>
    <div class="note">頻率由左至右映射：低頻 → 中頻 → 高頻；各區段獨立上下起伏</div>
    <div class="row"><label>反應強度</label><input type="range" id="audioReact" min="0" max="2" step="0.02" value="0.9"><span class="val" id="audioReact_v"></span></div>
    <div class="row"><label>節拍靈敏</label><input type="range" id="beatSens" min="1" max="2.2" step="0.02" value="1.35"><span class="val" id="beatSens_v"></span></div>
    <input type="file" id="audioFileInput" accept="audio/*" hidden>
  </div>
  <div class="group">
    <h3>簾幕 Curtains</h3>
    <div class="row"><label>簾幕數量</label><input type="range" id="curtains" min="1" max="4" step="1" value="3"><span class="val" id="curtains_v"></span></div>
    <div class="row"><label>波動速度</label><input type="range" id="waveSpeed" min="0.1" max="3" step="0.05" value="1"><span class="val" id="waveSpeed_v"></span></div>
    <div class="row"><label>波動尺度</label><input type="range" id="waveScale" min="0.4" max="2.5" step="0.05" value="1"><span class="val" id="waveScale_v"></span></div>
    <div class="row"><label>亮度強度</label><input type="range" id="intensity" min="0.2" max="2" step="0.05" value="1"><span class="val" id="intensity_v"></span></div>
    <div class="row"><label>簾幕高度</label><input type="range" id="curtainH" min="0.4" max="1.6" step="0.05" value="1"><span class="val" id="curtainH_v"></span></div>
  </div>

  <div class="group">
    <h3>色彩 Color</h3>
    <div class="note">以綠色為核心，邊緣過渡到青／紫／粉</div>
    <div class="row"><label>色相偏移</label><input type="range" id="hueShift" min="-90" max="90" step="1" value="0"><span class="val" id="hueShift_v"></span></div>
    <div class="row"><label>邊緣暈彩</label><input type="range" id="edgeTint" min="0" max="1" step="0.01" value="0.65"><span class="val" id="edgeTint_v"></span></div>
  </div>

  <div class="group">
    <h3>環境 Ambience</h3>
    <div class="row"><label>星空數量</label><input type="range" id="starCount" min="0" max="500" step="10" value="220"><span class="val" id="starCount_v"></span></div>
    <div class="row"><label>雪地映光</label><input type="checkbox" id="snowGlow" checked><span class="val"></span></div>
    <div class="row"><label>柔光反射</label><input type="checkbox" id="reflection" checked><span class="val"></span></div>
    <div class="row"><label>近景雪粒</label><input type="checkbox" id="snowParticles" checked><span class="val"></span></div>
  </div>
  </div>

  <div class="btns">
    <button id="resetBtn">↺ 重設</button>
  </div>
</div>
<button id="toggleBtn">⚙ 面板</button>
<button id="playCtl">⏸ 暫停</button>

<script src="./aurora.js"></script>
</body>
</html>
