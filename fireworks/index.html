<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireworks VFX</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./fireworks.css">
<link rel="stylesheet" href="../switch2-theme.css?v=mobile-sheet-14">
<script src="../preview-performance.js"></script>
<script src="../mobile-control-sheet.js?v=mobile-sheet-14"></script>
</head>
<body>
<canvas id="stage"></canvas>

<a id="homeBtn" href="../index.html">← 首頁</a>

<div id="panel">
  <h2>FIREWORKS</h2>
  <div class="sub">璀璨烟火特效 — 點擊畫面任意處發射</div>

  <div class="groups">
  <div class="group">
    <h3>煙火編排 Show</h3>
    <div class="preset-grid" id="presets">
      <button data-preset="festival">節慶</button><button data-preset="cinema">電影感</button><button data-preset="willow">金柳</button>
    </div>
    <div class="row"><label>煙火類型</label><select id="burstStyle"><option value="random">隨機混合</option><option value="peony">牡丹</option><option value="chrysanthemum">菊花</option><option value="ring">圓環</option><option value="willow">金柳</option><option value="palm">椰樹</option><option value="heart">愛心</option><option value="double">二段爆裂</option><option value="text">文字煙火</option></select><span class="val"></span></div>
    <div class="text-firework" id="textFirework">
      <input type="text" id="fireworkText" value="VFX" maxlength="10" aria-label="煙火文字">
      <div class="row"><label>文字色彩</label><select id="textColorMode"><option value="palette">跟隨配色</option><option value="rainbow">彩虹漸層</option><option value="gold">金白火花</option><option value="custom">自訂單色</option></select><span class="val"></span></div>
      <div class="row"><label>文字尺寸</label><input type="range" id="textSize" min="0.45" max="1.35" step="0.05" value="0.85"><span class="val" id="textSize_v"></span></div>
      <div class="row"><label>粒子密度</label><input type="range" id="textDensity" min="2" max="7" step="1" value="4"><span class="val" id="textDensity_v"></span></div>
      <div class="row"><label>維持時間</label><input type="range" id="textHold" min="0.3" max="2.5" step="0.1" value="1.2"><span class="val" id="textHold_v"></span></div>
    </div>
    <div class="row"><label>混合文字煙火</label><input type="checkbox" id="mixText" checked><span class="val"></span></div>
    <div class="row"><label>齊射數量</label><input type="range" id="salvo" min="1" max="7" step="1" value="3"><span class="val" id="salvo_v"></span></div>
  </div>
  <div class="group">
    <h3>發射 Launch</h3>
    <div class="row"><label>自動頻率</label><input type="range" id="autoRate" min="0" max="4" step="0.05" value="1.1"><span class="val" id="autoRate_v"></span></div>
    <div class="row"><label>同時最大數</label><input type="range" id="maxRockets" min="1" max="16" step="1" value="6"><span class="val" id="maxRockets_v"></span></div>
    <div class="row"><label>升空速度</label><input type="range" id="launchSpeed" min="0.5" max="1.6" step="0.01" value="1"><span class="val" id="launchSpeed_v"></span></div>
  </div>

  <div class="group">
    <h3>爆炸 Burst</h3>
    <div class="note">爆炸型態隨機：球形／環形／柳枝／雙層／愛心</div>
    <div class="row"><label>粒子數</label><input type="range" id="particleCount" min="30" max="300" step="5" value="150"><span class="val" id="particleCount_v"></span></div>
    <div class="row"><label>爆炸半徑</label><input type="range" id="burstRadius" min="0.5" max="3.5" step="0.01" value="1.85"><span class="val" id="burstRadius_v"></span></div>
    <div class="row"><label>重力</label><input type="range" id="gravity" min="0" max="400" step="5" value="130"><span class="val" id="gravity_v"></span></div>
    <div class="row"><label>拖尾殘影</label><input type="range" id="trail" min="0" max="0.95" step="0.01" value="0.82"><span class="val" id="trail_v"></span></div>
    <div class="row"><label>二段爆炸機率</label><input type="range" id="doubleProb" min="0" max="1" step="0.01" value="0.25"><span class="val" id="doubleProb_v"></span></div>
    <div class="row"><label>火花分岔</label><input type="range" id="crackle" min="0" max="1" step="0.01" value="0.35"><span class="val" id="crackle_v"></span></div>
    <div class="row"><label>軌跡長度</label><input type="range" id="sparkTrail" min="1" max="10" step="1" value="6"><span class="val" id="sparkTrail_v"></span></div>
  </div>

  <div class="group">
    <h3>色彩 Color</h3>
    <div class="row"><label>隨機彩色</label><input type="checkbox" id="randColor" checked><span class="val"></span></div>
    <div class="row"><label>單色相</label><input type="range" id="hue" min="0" max="360" step="1" value="30"><span class="val" id="hue_v"></span></div>
    <div class="row"><label>飽和度</label><input type="range" id="sat" min="0" max="100" step="1" value="100"><span class="val" id="sat_v"></span></div>
    <div class="row"><label>閃爍</label><input type="range" id="flicker" min="0" max="1" step="0.01" value="0.6"><span class="val" id="flicker_v"></span></div>
    <div class="row"><label>配色</label><select id="palette"><option value="classic">經典暖白</option><option value="jewel">寶石彩</option><option value="gold">金色</option><option value="ice">冰藍銀白</option></select><span class="val"></span></div>
  </div>

  <div class="group">
    <h3>環境 Ambience</h3>
    <div class="row"><label>星空數量</label><input type="range" id="starCount" min="0" max="400" step="5" value="140"><span class="val" id="starCount_v"></span></div>
    <div class="row"><label>天際線</label><input type="checkbox" id="skyline" checked><span class="val"></span></div>
    <div class="row"><label>煙霧濃度</label><input type="range" id="smokeAmount" min="0" max="1" step="0.01" value="0.55"><span class="val" id="smokeAmount_v"></span></div>
    <div class="row"><label>風向</label><input type="range" id="wind" min="-80" max="80" step="1" value="12"><span class="val" id="wind_v"></span></div>
    <div class="row"><label>環境閃光</label><input type="range" id="illumination" min="0" max="1" step="0.01" value="0.24"><span class="val" id="illumination_v"></span></div>
  </div>
  </div>

  <div class="btns">
    <button id="salvoBtn">✦ 齊射</button><button id="resetBtn">↺ 重設</button>
  </div>
</div>
<button id="toggleBtn">⚙ 面板</button>
<button id="playCtl">⏸ 暫停</button>

<script src="./fireworks.js"></script>
</body>
</html>
