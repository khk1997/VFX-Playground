<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakura Storm VFX</title>
<link rel="stylesheet" href="./sakura-blizzard.css">
<link rel="stylesheet" href="../switch2-theme.css?v=mobile-sheet-22">
<script src="../preview-performance.js"></script>
<script src="../mobile-control-sheet.js?v=mobile-sheet-22"></script>
</head>
<body data-mobile-ui="compact">
<canvas id="stage"></canvas>
<div class="topbar"><a class="home" href="../index.html">← 首頁</a><button id="toggle">⚙ 面板</button></div>
<aside id="panel">
  <h1>櫻花飄落</h1><p>SAKURA STORM · 45° WIND</p>
  <label>花瓣數量 <input id="amount" type="range" min="20" max="260" value="120"></label>
  <label><span id="angleLabel">風向 45°</span><input id="angle" type="range" min="-90" max="180" step="1" value="45"></label>
  <label>風速 <input id="speed" type="range" min=".25" max="2.4" step=".01" value="1" disabled></label>
  <label>亂流 <input id="turbulence" type="range" min="0" max="2" step=".01" value=".72"></label>
  <label>花瓣大小 <input id="size" type="range" min=".45" max="1.8" step=".01" value="1"></label>
  <label>嫩櫻葉比例 <input id="leaves" type="range" min="0" max="40" step="1" value="0"></label>
  <label>櫻花顏色 <input id="petalColor" type="color" value="#efb0c2"></label>
  <label>嫩櫻葉顏色 <input id="leafColor" type="color" value="#efb0c2"></label>
  <label class="check">無縫循環 <input id="seamless" type="checkbox" checked></label>
  <label><span id="loopLabel">循環 6 秒</span><input id="loopSec" type="range" min="2" max="15" step=".5" value="6"></label>
  <p id="loopNote">無縫模式下，循環秒數會取代風速決定移動速度。</p>
</aside>
<button id="playCtl">⏸ 暫停</button>
<script src="./sakura-blizzard.js"></script>
</body>
</html>
